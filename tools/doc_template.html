<!doctype html>
<html lang="__placeholder_lang__">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>__placeholder_title__</title>
	<link rel="stylesheet" href="__placeholder_relative__assets/style.css">
	<link rel="stylesheet" href="__placeholder_relative__assets/sh.css">
</head>
<body class="alt apidoc" id="api-section-documentation">

	<style>
		#column1.interior {
			overflow-wrap: break-word;
		}
	
		img {
			max-width: 100%;
		}

	</style>
	
	<div id="content" class="clearfix">

		<div id="column2" class="interior">

			<!--div id="intro" class="interior">
				<a href="/" id="home2" title="Go back to the home page">
					quark
				</a>
			</div-->

			__placeholder_index__

		</div>
		
		<div id="column1" data-id="documentation" class="interior">
			<header>
				<h1>Quark __placeholder_version__ __placeholder_documentation__</h1>
				<div id="gtoc">
					<p>
						<a href="/doc" id="index">__placeholder_index_label__</a> |
						<a href="/" id="home">__placeholder_home_label__</a>
					</p>
				</div>
			</header>

			<details id="toc">
				<summary>__placeholder_contents__</summary>
				__placeholder_toc__
			</details>

			<div id="apicontent">
				__placeholder_body__
			</div>

		</div>

	</div>

	<script src="__placeholder_relative__assets/sh_main.js"></script>
	<script src="__placeholder_relative__assets/sh_javascript.min.js"></script>

	<script>
		highlight(undefined, undefined, 'pre');
		var src = '__placeholder_src__';
		var relative = '__placeholder_relative__';
		var column2 = document.getElementById('column2');
		var a = column2.querySelector('li > a[href="' + src + '"]')
		if ( a ) {
			a.classList.add('on');
		}
		var sidebarScrollKey = 'quark-doc-sidebar-scroll';
		var sidebarScroll = sessionStorage.getItem(sidebarScrollKey);
		if ( sidebarScroll !== null ) {
			column2.scrollTop = Number(sidebarScroll) || 0;
		} else if ( a ) {
			a.scrollIntoView({ block: 'center' });
		}
		window.addEventListener('pagehide', function() {
			sessionStorage.setItem(sidebarScrollKey, String(column2.scrollTop));
		});
		if ( relative ) {
			column2.querySelectorAll('li > a').forEach(function(a) {
				var href = a.getAttribute('href');
				if ( !href.match(/^(\/|https?:\/\/)/) ) {
					a.setAttribute('href', relative + href);
				}
			});
		}
		document.getElementById('index').href = relative + '.';
		document.getElementById('home').href = relative + '..';
		// document.getElementById('home2').href = relative + '..';
	</script>

</body>
</html>
